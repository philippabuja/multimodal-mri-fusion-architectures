name: mri-ad-fusion
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.11.0
      - numpy==2.1.3
      - scipy==1.17.1
      - nibabel==5.4.0
      - pandas==2.3.3
      - scikit-learn==1.5.2
      - matplotlib==3.9.4
      - psmpy==0.3.16
      - hd-bet==2.0.1
# External (not pip-installable): FSL >= 6.0 (flirt, fnirt, invwarp, applywarp, fslmaths,
# MNI152 templates, Harvard-Oxford and cerebellum atlases).
